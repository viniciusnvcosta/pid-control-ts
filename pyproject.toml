[project]
name = "pid-control-ts"
version = "0.1.0"
requires-python = ">=3.11.13"
dependencies = [
    "darts>=0.47.0",
    "matplotlib>=3.11.2",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcp", "core"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib -m 'not slow and not integration'"
markers = [
    "slow: expensive statistical checks",
    "integration: needs data/deaths.csv (gitignored, see docs/development.md)",
]

[tool.ruff.lint]
extend-select = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
